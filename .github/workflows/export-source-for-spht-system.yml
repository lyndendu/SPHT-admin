name: Export source for SPHT-system

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=tar.gz --output=spht-admin-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: spht-admin-source
          path: spht-admin-source.tar.gz
          if-no-files-found: error
          retention-days: 1
