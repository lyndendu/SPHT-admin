name: Apply migration type fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/migration/apply-type-compat.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/monorepo-migration-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - name: Apply deterministic compatibility fixes
        run: node scripts/migration/apply-type-compat.mjs

      - name: Commit fixes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src
          if git diff --cached --quiet; then
            echo "Compatibility fixes are already applied."
          else
            git commit -m "fix: preserve chart behavior with strict types"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
