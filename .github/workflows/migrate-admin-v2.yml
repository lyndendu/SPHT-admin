name: Build SPHT admin monorepo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-admin-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spht-admin-monorepo-migration-v2
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'lyndendu/SPHT-admin'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      SOURCE_REPOSITORY: arhamkhnz/next-shadcn-admin-dashboard
      SOURCE_COMMIT: 4727cc7533d46e44b401cac34a38da8566ae9677
      MIGRATION_BRANCH: chore/monorepo-migration-v2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$MIGRATION_BRANCH"
          chmod +x scripts/migration/import-upstream.sh

      - name: Import and restructure the upstream repository
        run: scripts/migration/import-upstream.sh

      - name: Push the generated workspace
        run: |
          git add --all
          git commit -m "refactor: migrate admin dashboard into monorepo"
          git push --force origin "$MIGRATION_BRANCH"

      - name: Open or update the draft pull request
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          - imports the complete upstream dashboard into `apps/admin`
          - adds pnpm workspaces and Turborepo at the repository root
          - moves reusable shadcn primitives to `packages/ui`
          - moves reusable responsive hooks to `packages/hooks`
          - moves the shared `cn` utility to `packages/utils`
          - preserves all other upstream files and the MIT license under `apps/admin`

          ## Verification

          Verification results are posted as a PR comment by GitHub Actions.

          Source snapshot: `arhamkhnz/next-shadcn-admin-dashboard@4727cc7533d46e44b401cac34a38da8566ae9677`.
          EOF

          if gh pr view "$MIGRATION_BRANCH" --json url >/dev/null 2>&1; then
            gh pr edit "$MIGRATION_BRANCH" --title "Refactor admin dashboard into monorepo" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$MIGRATION_BRANCH" --title "Refactor admin dashboard into monorepo" --body-file /tmp/pr-body.md --draft
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee /tmp/install.log

      - name: Type-check workspace
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Build workspace
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log

      - name: Run Biome checks
        id: biome
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @spht/admin check 2>&1 | tee /tmp/biome.log

      - name: Commit generated lockfile and verified configuration
        if: steps.install.outcome == 'success'
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore: add workspace lockfile"
            git push origin "$MIGRATION_BRANCH"
          fi

      - name: Post verification report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BIOME_OUTCOME: ${{ steps.biome.outcome }}
        run: |
          {
            echo "## Automated migration verification"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install | \`$INSTALL_OUTCOME\` |"
            echo "| TypeScript | \`$TYPECHECK_OUTCOME\` |"
            echo "| Next.js build | \`$BUILD_OUTCOME\` |"
            echo "| Biome | \`$BIOME_OUTCOME\` |"

            for entry in "install:/tmp/install.log" "typecheck:/tmp/typecheck.log" "build:/tmp/build.log" "biome:/tmp/biome.log"; do
              name="${entry%%:*}"
              file="${entry#*:}"
              if [ -f "$file" ]; then
                echo
                echo "<details><summary>${name} log tail</summary>"
                echo
                echo '```text'
                tail -n 100 "$file"
                echo '```'
                echo "</details>"
              fi
            done
          } > /tmp/verification-comment.md

          gh pr comment "$MIGRATION_BRANCH" --body-file /tmp/verification-comment.md

      - name: Enforce successful verification
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BIOME_OUTCOME: ${{ steps.biome.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$BIOME_OUTCOME" = "success"
